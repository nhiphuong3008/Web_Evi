<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <style>
      .blue-path { fill: #002be5; }
      .red-tick { fill: #e50000; }
      .logo-text { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-size: 46px; fill: #002be5; letter-spacing: 2.5px; }
    </style>
  </defs>

  <!-- Blue Crescent Shape -->
  <path class="blue-path" d="M 400 25 
           C 140 25, 20 180, 20 380 
           C 20 530, 130 605, 410 605 
           C 240 610, 85 510, 85 365 
           C 85 200, 210 75, 400 25 Z" />

  <!-- Red Checkmark Tick -->
  <path class="red-tick" d="M 135 185 
           C 220 270, 275 400, 298 475 
           C 310 400, 420 180, 560 25 
           C 425 170, 315 360, 298 410 
           C 275 360, 220 265, 135 185 Z" />

  <!-- Text ANH NGỮ VICARE -->
  <text x="300" y="640" text-anchor="middle" class="logo-text">ANH NGỮ VICARE</text>
</svg>
